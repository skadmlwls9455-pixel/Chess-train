<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>폐관 수련 도장</title>
<meta name="theme-color" content="#2b2926">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/app/icon-192.png">
<link rel="apple-touch-icon" href="img/app/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="수련 도장">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 에이든: 판 위에 작게 떠 있는 코치 -->
  <div class="coach" id="coach">
    <div class="avatar"><img id="face" alt="에이든"></div>
    <div class="bubble" id="bubble"><span id="say"></span></div>
  </div>

  <main>
    <!-- 도장 -->
    <section id="v-home" class="view">
      <div class="today" id="today"></div>
      <button class="primary big" id="nextBtn"></button>
      <div class="ladder" id="ladder"></div>
    </section>

    <!-- 대국 설정 -->
    <section id="v-setup" class="view">
      <div class="tierstrip" id="setupTiers"></div>
      <div class="seg" id="segColor"></div>
      <div class="seg" id="segClock"></div>
      <div class="switchrow">
        <span class="lbl" id="checkLbl"></span>
        <button class="iconbtn" id="checkInfo" aria-label="점검 모드 설명"></button>
        <label class="switch"><input type="checkbox" id="optCheck"><i></i></label>
      </div>
      <div class="sticky"><button class="primary big" id="startGame">시작</button></div>
    </section>

    <!-- 판: 대국, 되감기, 카드, 오답이 모두 여기서 -->
    <section id="v-play" class="view">
      <div class="strip top"><span id="oppName"></span><span class="clock" id="oppClock"></span></div>
      <div class="boardwrap">
        <div class="board" id="board"></div>
        <div class="promo"></div>
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="strip bottom"><span id="myName">나</span><span class="chips" id="status"></span><span class="clock" id="myClock"></span></div>
      <div class="actions" id="actions"></div>
    </section>

    <!-- 오프닝 카드 -->
    <section id="v-cards" class="view">
      <button class="primary big" id="dueCards"></button>
      <div id="cardGroups"></div>
    </section>

    <!-- 오답노트 -->
    <section id="v-notes" class="view">
      <button class="primary big" id="dueNotes"></button>
      <div class="filters" id="noteFilters"></div>
      <div class="list" id="noteList"></div>
    </section>

    <!-- 일지 -->
    <section id="v-log" class="view">
      <div class="stats" id="stats"></div>
      <div class="bars" id="tagBars"></div>
      <div class="list" id="gameList"></div>
      <div class="backup">
        <button class="textbtn" id="exportBtn"></button>
        <label class="textbtn"><input type="file" id="importFile" accept="application/json" hidden><span id="importLbl"></span></label>
      </div>
    </section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-v="home" data-i="home"><span>도장</span></button>
    <button data-v="setup" data-i="play"><span>대국</span></button>
    <button data-v="cards" data-i="cards"><span>오프닝</span></button>
    <button data-v="notes" data-i="notes"><span>오답</span></button>
    <button data-v="log" data-i="log"><span>일지</span></button>
  </nav>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
